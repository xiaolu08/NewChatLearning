<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NewChatLearning Beta</title>
    <style>
      :root { color-scheme: light; --bg: #f3f5f6; --panel: #fff; --text: #172026; --muted: #69757d; --line: #d9dfe3; --accent: #087f5b; --danger: #c43d3d; --warn: #a85a00; }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #171b1e; --panel: #22282c; --text: #edf1f3; --muted: #a9b2b8; --line: #3a4247; --accent: #53c99b; --danger: #ff8585; --warn: #ffb75e; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
      header { min-height: 64px; background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      h1 { margin: 0; font-size: 20px; font-weight: 650; }
      h2 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0; color: var(--muted); }
      button, input, select { font: inherit; }
      button { border: 1px solid transparent; border-radius: 6px; background: var(--accent); color: #fff; min-height: 38px; padding: 8px 14px; cursor: pointer; }
      button.secondary { background: transparent; color: var(--text); border-color: var(--line); }
      button:disabled { opacity: .55; cursor: wait; }
      input { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); padding: 8px 10px; }
      select { min-height: 38px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); padding: 7px 10px; }
      label { display: block; color: var(--muted); margin: 14px 0 5px; }
      main { max-width: 1120px; margin: 0 auto; padding: 24px; }
      .beta { color: var(--warn); font-weight: 650; }
      .auth-shell { min-height: calc(100vh - 113px); display: grid; place-items: center; }
      .auth-panel { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
      .auth-panel button { width: 100%; margin-top: 18px; }
      .message { min-height: 22px; margin-top: 10px; color: var(--danger); }
      .notice { border-left: 4px solid var(--warn); background: var(--panel); padding: 12px 16px; margin-bottom: 18px; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-height: 96px; }
      .metric span { color: var(--muted); display: block; margin-bottom: 8px; }
      .metric strong { font-size: 24px; font-weight: 650; }
      section { margin-top: 20px; }
      table { width: 100%; border-collapse: collapse; background: var(--panel); }
      th, td { padding: 11px 14px; border: 1px solid var(--line); text-align: left; overflow-wrap: anywhere; }
      th { width: 210px; color: var(--muted); font-weight: 550; }
      .ok { color: var(--accent); }
      .error { color: var(--danger); }
      .hidden { display: none !important; }
      .actions { display: flex; gap: 8px; }
      .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
      .tabs button { background: transparent; color: var(--muted); border-radius: 0; padding: 10px 14px; }
      .tabs button.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
      .toolbar { display: flex; align-items: end; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
      .toolbar label { margin: 0 0 5px; }
      .field { min-width: 180px; flex: 1 1 220px; }
      .compact-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
      .summary { border: 1px solid var(--line); background: var(--panel); padding: 14px; min-height: 78px; }
      .summary span { display: block; color: var(--muted); margin-bottom: 4px; }
      .summary strong { font-size: 19px; }
      .result { min-height: 24px; margin-top: 12px; color: var(--muted); }
      dialog { width: min(460px, calc(100% - 32px)); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); padding: 22px; }
      dialog::backdrop { background: rgb(0 0 0 / .45); }
      dialog .actions { justify-content: flex-end; margin-top: 18px; }
      @media (max-width: 720px) { header { padding: 12px 16px; } main { padding: 16px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .compact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } th { width: 125px; } .actions { flex-wrap: wrap; } .toolbar button { flex: 1 1 120px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>NewChatLearning</h1>
      <div class="actions"><span class="beta">BETA</span><button id="logout" class="secondary hidden" type="button">退出</button></div>
    </header>
    <main id="auth" class="auth-shell">
      <form id="auth-form" class="auth-panel">
        <h2 id="auth-title">管理页面登录</h2>
        <p id="auth-copy">请输入独立管理密码。</p>
        <label for="password">管理密码</label>
        <input id="password" name="password" type="password" minlength="12" maxlength="256" autocomplete="current-password" required>
        <label id="confirm-label" class="hidden" for="confirm-password">确认密码</label>
        <input id="confirm-password" class="hidden" name="confirm-password" type="password" minlength="12" maxlength="256" autocomplete="new-password">
        <button id="submit" type="submit">登录</button>
        <div id="auth-message" class="message" role="status"></div>
      </form>
    </main>
    <main id="dashboard" class="hidden">
      <div class="notice">当前为 Beta 开发版本。核心学习和词库回复完全使用本地算法，不调用 LLM。</div>
      <nav class="tabs" aria-label="管理模块">
        <button id="tab-overview" class="active" type="button">概览</button>
        <button id="tab-media" type="button">媒体</button>
      </nav>
      <div id="overview-view"><div class="grid">
        <div class="metric"><span>运行状态</span><strong id="state">读取中</strong></div>
        <div class="metric"><span>问题数</span><strong id="questions">-</strong></div>
        <div class="metric"><span>答案数</span><strong id="answers">-</strong></div>
        <div class="metric"><span>待固化消息</span><strong id="pending">-</strong></div>
        <div class="metric"><span>媒体文件</span><strong id="media-count">-</strong></div>
        <div class="metric"><span>媒体占用</span><strong id="media-size">-</strong></div>
      </div>
      <section><table><tbody>
        <tr><th>插件版本</th><td id="version">-</td></tr>
        <tr><th>数据库</th><td id="database">-</td></tr>
        <tr><th>配置版本</th><td id="revision">-</td></tr>
        <tr><th>词库范围</th><td id="library">-</td></tr>
        <tr><th>核心策略</th><td>本地算法，零 LLM Token</td></tr>
        <tr><th>数据目录</th><td id="data-dir">-</td></tr>
      </tbody></table></section></div>
      <div id="media-view" class="hidden">
        <div class="toolbar">
          <div class="field"><label for="media-group">群聊</label><input id="media-group" list="media-groups" inputmode="numeric" placeholder="输入 QQ 群号"><datalist id="media-groups"></datalist></div>
          <button id="media-preview" class="secondary" type="button">读取预览</button>
          <button id="media-scan" type="button">扫描媒体</button>
        </div>
        <div class="compact-grid">
          <div class="summary"><span>失效组件</span><strong id="invalid-components">-</strong></div>
          <div class="summary"><span>受影响答案</span><strong id="affected-answers">-</strong></div>
          <div class="summary"><span>受影响问题</span><strong id="affected-questions">-</strong></div>
          <div class="summary"><span>清理后可能为空</span><strong id="empty-answers">-</strong></div>
          <div class="summary"><span>状态分布</span><strong id="media-states">-</strong></div>
        </div>
        <section>
          <div class="toolbar">
            <div class="field"><label for="cleanup-mode">清理模式</label><select id="cleanup-mode"><option value="prune">仅移除失效组件</option><option value="drop-answer">删除含失效媒体的整条答案</option></select></div>
            <button id="cleanup-prepare" class="secondary" type="button">生成清理计划</button>
            <button id="cleanup-apply" class="hidden" type="button">确认并执行</button>
          </div>
          <div id="cleanup-plan" class="result">尚未生成清理计划。</div>
          <div id="media-message" class="result" role="status"></div>
        </section>
      </div>
    </main>
    <dialog id="reauth-dialog">
      <form id="reauth-form">
        <h2>确认执行媒体清理</h2>
        <p>执行前会自动备份数据库。请输入当前管理密码确认。</p>
        <label for="reauth-password">管理密码</label>
        <input id="reauth-password" type="password" autocomplete="current-password" required>
        <div id="reauth-message" class="message" role="status"></div>
        <div class="actions"><button id="reauth-cancel" class="secondary" type="button">取消</button><button type="submit">执行清理</button></div>
      </form>
    </dialog>
    <script>
      let authState = null;
      let cleanupPlan = null;
      const bridge = window.AstrBotPluginPage;
      const el = (id) => document.getElementById(id);
      const setText = (id, value) => { el(id).textContent = String(value); };
      const unwrap = (response) => response?.data || response || {};
      const payloadData = (response) => { const value = unwrap(response); return value.data || value; };
      const formatBytes = (bytes) => bytes < 1024 ? `${bytes} B` : bytes < 1024 ** 2 ? `${(bytes / 1024).toFixed(1)} KB` : bytes < 1024 ** 3 ? `${(bytes / 1024 ** 2).toFixed(1)} MB` : `${(bytes / 1024 ** 3).toFixed(2)} GB`;

      async function refreshAuth() {
        authState = payloadData(await bridge.apiGet("api/auth/state"));
        if (authState.authenticated) return showDashboard();
        el("auth").classList.remove("hidden");
        el("dashboard").classList.add("hidden");
        el("logout").classList.add("hidden");
        const setup = Boolean(authState.setup_required);
        setText("auth-title", setup ? "首次设置管理密码" : "管理页面登录");
        setText("auth-copy", setup ? "首次设置只能从运行 AstrBot 的本机完成，密码至少 12 个字符。" : "请输入 NewChatLearning 的独立管理密码。");
        setText("submit", setup ? "设置密码" : "登录");
        el("confirm-label").classList.toggle("hidden", !setup);
        el("confirm-password").classList.toggle("hidden", !setup);
        el("password").autocomplete = setup ? "new-password" : "current-password";
      }

      async function showDashboard() {
        el("auth").classList.add("hidden");
        el("dashboard").classList.remove("hidden");
        el("logout").classList.remove("hidden");
        const status = payloadData(await bridge.apiGet("api/status"));
        setText("state", status.state === "running" ? "运行中" : status.state);
        el("state").className = "ok";
        setText("questions", status.statistics.questions);
        setText("answers", status.statistics.answers);
        setText("pending", status.statistics.pending_messages);
        setText("media-count", status.statistics.media_assets);
        setText("media-size", formatBytes(status.statistics.media_bytes));
        setText("version", `${status.version} (${status.release_stage})`);
        setText("database", `schema v${status.database.schema_version}, ${status.database.integrity}`);
        setText("revision", status.config_revision);
        setText("library", status.library.mode === "global" ? `全局/标签（${status.library.tagged_groups} 个群，${status.library.tags.length} 个标签）` : "仅本群");
        setText("data-dir", status.data_dir);
        await loadMediaGroups();
      }

      function showView(view) {
        const media = view === "media";
        el("overview-view").classList.toggle("hidden", media);
        el("media-view").classList.toggle("hidden", !media);
        el("tab-overview").classList.toggle("active", !media);
        el("tab-media").classList.toggle("active", media);
      }

      async function loadMediaGroups() {
        try {
          const data = payloadData(await bridge.apiGet("api/media/groups"));
          el("media-groups").replaceChildren(...(data.group_ids || []).map(groupId => {
            const option = document.createElement("option"); option.value = groupId; return option;
          }));
          if (!el("media-group").value && data.group_ids?.length) el("media-group").value = data.group_ids[0];
        } catch (_) {}
      }

      function selectedGroup() {
        const groupId = el("media-group").value.trim();
        if (!/^\d{5,20}$/.test(groupId)) throw new Error("请输入有效的 QQ 群号。");
        return groupId;
      }

      function renderPreview(preview) {
        setText("invalid-components", preview.media_components ?? 0);
        setText("affected-answers", preview.affected_answers ?? 0);
        setText("affected-questions", preview.affected_questions ?? 0);
        setText("empty-answers", preview.answers_becoming_empty ?? 0);
        const states = Object.entries(preview.states || {}).map(([key, value]) => `${key} ${value}`).join(" / ");
        setText("media-states", states || "无记录");
      }

      async function postSecure(path, body) {
        return payloadData(await bridge.apiPost(path, { ...body, csrf_token: authState?.csrf_token || "" }));
      }

      async function loadMediaPreview() {
        const groupId = selectedGroup();
        const data = payloadData(await bridge.apiGet("api/media/preview", { group_id: groupId }));
        renderPreview(data); return data;
      }

      el("auth-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = el("password").value;
        const setup = Boolean(authState?.setup_required);
        if (setup && password !== el("confirm-password").value) {
          setText("auth-message", "两次输入的密码不一致。"); return;
        }
        el("submit").disabled = true; setText("auth-message", "");
        try {
          const response = await bridge.apiPost(setup ? "api/auth/setup" : "api/auth/login", { password });
          authState = { setup_required: false, authenticated: true, csrf_token: payloadData(response).csrf_token };
          el("password").value = ""; el("confirm-password").value = "";
          await showDashboard();
        } catch (error) { setText("auth-message", error?.message || "操作失败，请稍后重试。"); }
        finally { el("submit").disabled = false; }
      });

      el("logout").addEventListener("click", async () => {
        try { await bridge.apiPost("api/auth/logout", { csrf_token: authState?.csrf_token || "" }); }
        finally { authState = null; await refreshAuth(); }
      });
      el("tab-overview").addEventListener("click", () => showView("overview"));
      el("tab-media").addEventListener("click", () => showView("media"));
      el("media-preview").addEventListener("click", async () => {
        try { setText("media-message", "读取中..."); await loadMediaPreview(); setText("media-message", "预览已更新。"); }
        catch (error) { setText("media-message", error?.message || "读取失败。"); }
      });
      el("media-scan").addEventListener("click", async () => {
        try {
          setText("media-message", "正在扫描，不会删除内容...");
          const data = await postSecure("api/media/scan", { group_id: selectedGroup() });
          renderPreview(data.preview || {}); cleanupPlan = null; el("cleanup-apply").classList.add("hidden");
          setText("cleanup-plan", "尚未生成清理计划。");
          setText("media-message", `扫描完成：${data.scanned_answers} 个答案，${data.scanned_components} 个媒体组件。`);
        } catch (error) { setText("media-message", error?.message || "扫描失败。"); }
      });
      el("cleanup-prepare").addEventListener("click", async () => {
        try {
          const data = await postSecure("api/media/cleanup/prepare", { group_id: selectedGroup(), mode: el("cleanup-mode").value });
          cleanupPlan = data; el("cleanup-apply").classList.remove("hidden");
          setText("cleanup-plan", `计划 ${data.plan_id}：失效组件 ${data.invalid_components}，更新答案 ${data.update_answers}，删除答案 ${data.delete_answers}。计划一小时内有效。`);
          setText("media-message", "计划已生成，词库尚未改变。");
        } catch (error) { setText("media-message", error?.message || "无法生成清理计划。"); }
      });
      el("cleanup-apply").addEventListener("click", () => { el("reauth-password").value = ""; setText("reauth-message", ""); el("reauth-dialog").showModal(); });
      el("reauth-cancel").addEventListener("click", () => el("reauth-dialog").close());
      el("reauth-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!cleanupPlan) return;
        try {
          const data = await postSecure("api/media/cleanup/apply", { group_id: selectedGroup(), plan_id: cleanupPlan.plan_id, password: el("reauth-password").value });
          el("reauth-password").value = "";
          el("reauth-dialog").close(); cleanupPlan = null; el("cleanup-apply").classList.add("hidden");
          setText("cleanup-plan", `清理完成，执行前备份：${data.backup_name}`);
          setText("media-message", `移除组件 ${data.removed_components}，更新答案 ${data.updated_answers}，删除答案 ${data.deleted_answers}。`);
          await loadMediaPreview();
        } catch (error) { el("reauth-password").value = ""; setText("reauth-message", error?.message || "清理未执行。"); }
      });

      (async () => {
        try { await bridge.ready(); await refreshAuth(); }
        catch (error) { setText("auth-message", error?.message || "页面初始化失败。"); }
      })();
    </script>
  </body>
</html>
